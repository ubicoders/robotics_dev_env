# All versions (${...}) are defined in .env, which docker compose reads automatically.
# Every build uses the repository root as context, so Dockerfiles COPY from
# common/ and from their own folder under images/ with root-relative paths.
# Build order (parents before children) is defined in build.bash.

x-default-configuration: &default-configuration
  network_mode: host
  privileged: true
  stdin_open: true # docker run -i
  tty: true        # docker run -t
  environment:
    - DISPLAY
    - QT_X11_NO_MITSHM=1
  volumes:
    - "/tmp/.X11-unix/:/tmp/.X11-unix/:rw"
    - "$HOME/.Xauthority:/root/.Xauthority:rw"
    - "/dev/:/dev/"

x-cuda-configuration: &cuda-configuration
  <<: *default-configuration
  runtime: nvidia
  deploy:
    resources:
        reservations:
            devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, compat32, video, display]

services:
# ==========================================
# Ubuntu 24 + PX4 toolchain (no ROS 2)
# ==========================================
  px4:
    container_name: ubicoders_u24_px4_cnt
    build:
      context: .
      dockerfile: ./images/px4/Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        PX4_TOOLCHAIN_VERSION: ${PX4_TOOLCHAIN_VERSION}
        MINICONDA_INSTALLER: ${MINICONDA_INSTALLER}
        EMPY_VERSION: ${EMPY_VERSION}
    image: ubicoders/px4:${PX4_TOOLCHAIN_VERSION}
    <<: *default-configuration

# ==========================================
# ROS 2 lineage, from osrf/ros
# ==========================================
  ros2:
    container_name: ubicoders_ros2_jazzy_cnt
    build:
      context: .
      dockerfile: ./images/ros2/base/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
        UBUNTU_CODENAME: ${UBUNTU_CODENAME}
        MINICONDA_INSTALLER: ${MINICONDA_INSTALLER}
        EMPY_VERSION: ${EMPY_VERSION}
        RUST_VERSION: ${RUST_VERSION}
        ROS2_RUST_VERSION: ${ROS2_RUST_VERSION}
        R2R_VERSION: ${R2R_VERSION}
        CARGO_AMENT_BUILD_VERSION: ${CARGO_AMENT_BUILD_VERSION}
        COLCON_CARGO_VERSION: ${COLCON_CARGO_VERSION}
        COLCON_ROS_CARGO_VERSION: ${COLCON_ROS_CARGO_VERSION}
        ROSIDL_RUST_VERSION: ${ROSIDL_RUST_VERSION}
        ROSIDL_RUNTIME_RS_VERSION: ${ROSIDL_RUNTIME_RS_VERSION}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: ubicoders/ros2:${ROS_DISTRO}
    <<: *default-configuration
    # Runs as ubuntu, so the home mount differs from the root-based services.
    volumes:
      - "/tmp/.X11-unix/:/tmp/.X11-unix/:rw"
      - "$HOME/.Xauthority:/home/ubuntu/.Xauthority:rw"
      - "/dev/:/dev/"

  ros2_px4:
    container_name: ubicoders_ros2_jazzy_px4_cnt
    build:
      context: .
      dockerfile: ./images/ros2/px4/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
        PX4_TOOLCHAIN_VERSION: ${PX4_TOOLCHAIN_VERSION}
        PX4_MSGS_VERSION: ${PX4_MSGS_VERSION}
        EMPY_VERSION: ${EMPY_VERSION}
    image: ubicoders/ros2:${ROS_DISTRO}_px4
    depends_on:
      - ros2
    <<: *default-configuration

  ros2_px4_uxrcedds:
    container_name: ubicoders_ros2_jazzy_px4_uxrcedds_cnt
    build:
      context: .
      dockerfile: ./images/ros2/px4/uxrcedds/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
        UXRCE_DDS_AGENT_VERSION: ${UXRCE_DDS_AGENT_VERSION}
        EMPY_VERSION: ${EMPY_VERSION}
    image: ubicoders/ros2:${ROS_DISTRO}_px4_uxrcedds
    depends_on:
      - ros2_px4
    <<: *default-configuration

  ros2_svo:
    container_name: ubicoders_ros2_jazzy_svo_cnt
    build:
      context: .
      dockerfile: ./images/ros2/svo/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
    image: ubicoders/ros2:${ROS_DISTRO}_svo
    <<: *default-configuration

# ==========================================
# CUDA lineage, from nvidia/cuda
# ==========================================
  cuda:
    container_name: ubicoders_u24_cuda12_cnt
    build:
      context: .
      dockerfile: ./images/cuda/base/Dockerfile
      args:
        CUDA_VERSION: ${CUDA_VERSION}
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        MINICONDA_INSTALLER: ${MINICONDA_INSTALLER}
        EMPY_VERSION: ${EMPY_VERSION}
    image: ubicoders/ubuntu:u24_cuda12
    <<: *cuda-configuration

  cuda_ocv_zed:
    container_name: ubicoders_u24_cuda12_ocv_zed_cnt
    build:
      context: .
      dockerfile: ./images/cuda/ocv_zed/Dockerfile
      args:
        OPENCV_VERSION: ${OPENCV_VERSION}
        OPENCV_PYTHON_VERSION: ${OPENCV_PYTHON_VERSION}
        ZED_PYTHON_VERSION: ${ZED_PYTHON_VERSION}
        ZED_SDK_INSTALLER: ${ZED_SDK_INSTALLER}
    image: ubicoders/ubuntu:u24_cuda12_ocv_zed
    depends_on:
      - cuda
    <<: *cuda-configuration

  cuda_ros2:
    container_name: ubicoders_u24_cuda12_jazzy_cnt
    build:
      context: .
      dockerfile: ./images/cuda/ros2/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO}
    image: ubicoders/ros2:${ROS_DISTRO}_cuda12
    depends_on:
      - cuda
    <<: *cuda-configuration
